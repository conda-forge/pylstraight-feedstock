{% set name = "pylstraight" %}
{% set version = "0.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pylstraight-{{ version }}.tar.gz
  sha256: 24b5c7fb2c3d14979133e2fb31c75007d3f8b7a9b237dec9ff2591085d7605a2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.20.3
    - scipy >=1.7.0
    - pysoundfile >=0.13.1

test:
  imports:
    - pylstraight
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/takenori-y/pylstraight
  summary: An unofficial Python reimplementation of the legacy-STRAIGHT
  dev_url: https://github.com/takenori-y/pylstraight
  doc_url: https://takenori-y.github.io/pylstraight/stable
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - takenori-y
